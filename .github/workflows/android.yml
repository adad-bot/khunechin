name: Build Android APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
          cp -r css js assets www/

      - name: Install Capacitor
        run: npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android

      # امضای ثابت: بدون این، هر بیلد کلید تازه می‌گیرد و آپدیت روی نسخهٔ قبلی نصب نمی‌شود
      - name: Restore keystore
        uses: actions/cache@v4
        with:
          path: android/khunechin.keystore
          key: khunechin-keystore-v1

      - name: Create keystore if missing
        working-directory: android
        run: |
          if [ ! -f khunechin.keystore ]; then
            keytool -genkeypair -v -keystore khunechin.keystore -alias khunechin \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass khunechin -keypass khunechin \
              -dname "CN=Khunechin, O=Khunechin, C=IR"
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Sign with stable key
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          OUT=android/app/build/outputs/apk/debug/khunechin.apk
          $BT/zipalign -f 4 "$APK" android/app/build/outputs/apk/debug/aligned.apk
          $BT/apksigner sign --ks android/khunechin.keystore \
            --ks-pass pass:khunechin --key-pass pass:khunechin \
            --out "$OUT" android/app/build/outputs/apk/debug/aligned.apk
          $BT/apksigner verify --print-certs "$OUT" | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: khunechin-debug-apk
          path: android/app/build/outputs/apk/debug/khunechin.apk
